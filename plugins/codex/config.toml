# DevBuddy, for Codex.
#
# Merge this into ~/.codex/config.toml. Codex reaches DevBuddy's MCP server over HTTPS, at /mcp on
# the address the web interface is on, and asks the `devbuddy` client for the token each time it
# connects (ADR-0015). The server is the same one the Claude plugin reaches: one tool surface, one
# pipeline, one set of rules. What differs between the two plugins is the instructions beside this
# file, never what the server allows.
#
# Nothing here holds a credential. ~/.codex/config.toml is one file for the whole operating-system
# account, so a token written into it would be the token every project and every session on that
# machine used. The token is in the operating system's credential store instead, per server and
# workspace, and `devbuddy register` in a checkout is what says which workspace that checkout is.
#
# Replace both addresses below with your server's, and keep them the same: the helper hands the
# token only to the server the checkout is registered to, and gives nothing to any other URL.

[mcp_servers.devbuddy]
url = "https://devbuddy.example.test/mcp"
http_headers_helper = "devbuddy mcp-headers --url https://devbuddy.example.test/mcp"

# Startup is a round trip through the gateway and a database lookup of the token.
startup_timeout_sec = 30
tool_timeout_sec = 120
