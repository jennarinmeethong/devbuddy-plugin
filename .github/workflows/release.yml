name: Release

# Cutting a release: the executables, the images, the SBOMs, and — the part SB-29 is actually
# about — signed provenance for all of it.
#
# Triggered by a tag rather than by a branch, because a release is a decision somebody makes on
# purpose. Nothing here runs on an ordinary push, and nothing here publishes anything until the
# test suite and the drills in docs/operations/release-matrix.md have passed on the same commit.
#
# Signing is keyless. GitHub's OIDC identity signs through Sigstore, so there is no private key in
# a secret for somebody to steal, rotate, or lose — the thing being attested to is "this workflow,
# on this commit, in this repository produced this artifact", which is the claim that is actually
# worth making.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for a re-run after a failure part-way through."
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REGISTRY: ghcr.io

jobs:
  # Nothing is published before this passes. A release that ships and then discovers its own test
  # failures has already done the damage a gate exists to prevent.
  verify:
    name: Build, test, and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevBuddy.slnx

      - name: Build
        run: dotnet build DevBuddy.slnx -c Release --no-restore

      # On Linux, with a Docker engine, so Testcontainers runs the integration tests, the security
      # scenarios, and the destroy-and-restore drill rather than skipping them.
      - name: Test
        run: dotnet test DevBuddy.slnx -c Release --no-build

      - name: Verify formatting
        run: dotnet format DevBuddy.slnx --verify-no-changes --severity warn

      - name: Build and test the web client
        working-directory: web/admin
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bun run build
          bun test

  # Every RID docs/operations/release-matrix.md lists as built. The matrix is the source of truth
  # for what ships; a RID missing here is one that document says is not published.
  executables:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Self-contained, and that is all it is: not single-file, not Native AOT. Neither is claimed
      # in the release matrix and neither is built here.
      - name: Publish
        run: |
          for host in Api McpServer Cli; do
            dotnet publish "src/hosts/DevBuddy.$host/DevBuddy.$host.csproj" \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -o "publish/${{ matrix.rid }}/$host"
          done
          # The `devbuddy` client (ADR-0015), which a person installs where their assistants run.
          dotnet publish "src/clients/DevBuddy.Client/DevBuddy.Client.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o "publish/${{ matrix.rid }}/Client"

      - name: Archive
        run: |
          mkdir -p dist
          tar -czf "dist/devbuddy-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executables-${{ matrix.rid }}
          path: dist/*.tar.gz

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevBuddy.slnx

      - name: Install the SBOM tool
        run: dotnet tool install --global CycloneDX

      # One document per shipped host, for the same reason the supply-chain workflow does it that
      # way: what is in the API image is not what is in the console.
      - name: Generate
        run: |
          for project in Api McpServer Cli; do
            dotnet CycloneDX "src/hosts/DevBuddy.$project/DevBuddy.$project.csproj" \
              --output sbom \
              --filename "devbuddy-$project.cdx.json" \
              --json
          done
          dotnet CycloneDX "src/clients/DevBuddy.Client/DevBuddy.Client.csproj" \
            --output sbom \
            --filename "devbuddy-Client.cdx.json" \
            --json

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.json

  images:
    name: Push and attest ${{ matrix.image }}
    needs: [verify, sbom]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api
            sbom: devbuddy-Api.cdx.json
          - image: mcp
            dockerfile: docker/Dockerfile.mcp
            sbom: devbuddy-McpServer.cdx.json
          - image: cli
            dockerfile: docker/Dockerfile.cli
            sbom: devbuddy-Cli.cdx.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For the arm64 half of the manifest. Nothing in these Dockerfiles RUNs on the target
      # platform — the SDK stage is pinned to the builder's own architecture and cross-compiles
      # with `-a $TARGETARCH` — so emulation is not on the build path. It is here for the base
      # image handling and so a future RUN in a runtime stage fails loudly rather than silently
      # producing an amd64-only manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Name and tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/devbuddy-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true

          # Both architectures under one tag. `linux/arm64` was in the original release-matrix
          # decision, was not built for v1.0.0, and the decision was amended rather than the
          # build added — honest, and it left every arm64 host without an image. Phase 12B
          # builds it. The row in docs/operations/release-matrix.md still moves to verified only
          # when somebody has *started* one, which is the same standard the native matrix holds.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The image runs as somebody other than root, checked here as well as in the supply-chain
      # workflow: this is the copy that gates a release rather than a branch (SB-31).
      #
      # Pulled back first, on purpose. Buildx pushes straight to the registry without leaving
      # anything in the local image store, so inspecting before pulling would inspect nothing —
      # and pulling means what gets checked is what was actually published, not a local build that
      # was meant to be identical.
      # Per architecture, not per tag. A manifest list can hold one image that drops root and one
      # that does not, and `docker pull` without --platform would only ever check the runner's own.
      - name: Check it runs as a non-root user
        run: |
          reference=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)

          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$reference"
            user=$(docker image inspect "$reference" --format '{{.Config.User}}')

            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::devbuddy-${{ matrix.image }} on $platform runs as '$user'."
              exit 1
            fi

            echo "devbuddy-${{ matrix.image }} on $platform runs as $user"
          done

      # What SB-29 asks for: somebody who pulls this image can verify where it came from without
      # having to trust whoever told them. `gh attestation verify` checks it against this
      # repository and this workflow.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/devbuddy-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Attached to the image it describes rather than to a tarball holding all three hosts, so
      # "which dependencies are in the thing I am running" has one unambiguous answer.
      #
      # `actions/attest`, not `actions/attest-sbom`: the latter is deprecated, which the
      # v1.1.1-rc.1 run said out loud the moment it was bumped off @v1. This is the rename and
      # nothing more — `sbom-path` is an input of `attest` itself, it still derives the CycloneDX
      # predicate from the document, and `predicate-type` must NOT be set alongside it.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/devbuddy-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/${{ matrix.sbom }}
          push-to-registry: true

  publish:
    name: Attest and publish the release
    needs: [executables, sbom, images]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: executables-*
          path: dist
          merge-multiple: true

      - name: Collect the SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      # For the smoke jobs below, which check the archive they were handed against this file, so
      # what they test is what the draft carries.
      - name: Upload the checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS

      # Provenance only, for these. Each archive holds all three hosts, so there is no single SBOM
      # that describes one of them — the per-host documents are attached to the per-host images in
      # the job above, and ship beside these as files.
      - name: Attest the executables
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            sbom/*.json
          fail_on_unmatched_files: true
          generate_release_notes: true

          # A semver prerelease is marked as one. Without this the draft cut from a tag like
          # v1.1.1-rc.1 carried prerelease=false, so pressing publish on it would have made a
          # release candidate the repository's "Latest" release, ahead of the real one. Observed
          # on the v1.1.1-rc.1 draft; the hyphen is what semver uses to say prerelease, and it is
          # the only thing distinguishing the two here.
          #
          # The container tags were already safe: docker/metadata-action skips the moving
          # {{major}}.{{minor}} tag for a prerelease, so 1.1 stayed on v1.1.0 through that run.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

          # Left as a draft on purpose. docs/operations/release-matrix.md asks for a
          # destroy-and-restore drill and an upgrade performed by hand; a release that published
          # itself would be claiming those happened. A person records what was actually verified in
          # the notes and then presses publish. The jobs below add the runners' smoke results to
          # this draft's notes, and a failed row fails this run.
          draft: true

  # Phase 14, A2: the release rows a hosted runner can do. The owner decided on 2026-09-24 (B4,
  # info.md) that these replace the hand smoke tests for win-arm64, linux-arm64, linux-musl-arm64
  # and osx-arm64. The scripts are the tag's own tools/release/, the ones a person runs by hand.
  #
  # The published images, started with the tag's Compose file on both architectures. Its list of
  # AI operation names is what every archive is compared against.
  post-images:
    name: Start the published images (${{ matrix.arch }})
    needs: images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DEVBUDDY_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      DEVBUDDY_REGISTRY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: post-images.sh
        run: bash tools/release/post-images.sh "${TAG#v}" "$RUNNER_TEMP/post-images"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-images-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/post-images/results/post-images-results.txt
            ${{ runner.temp }}/post-images/results/ai-operations.txt
          if-no-files-found: ignore

  # One archive per row, where its platform runs, against the checksum the draft carries. The x64
  # rows run here too, and they add to the hand runs on devrelease rather than replacing them: B4
  # decided the four above and nothing else.
  smoke:
    name: Smoke ${{ matrix.rid }}
    needs: [publish, post-images]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            arch: amd64
            image: ubuntu:24.04
          - rid: linux-musl-x64
            runner: ubuntu-latest
            arch: amd64
            image: alpine:3
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: ubuntu:24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: alpine:3
          - rid: osx-arm64
            runner: macos-15
            arch: arm64
          - rid: win-arm64
            runner: windows-11-arm
            arch: arm64
          - rid: win-x64
            runner: windows-latest
            arch: amd64

    env:
      RID: ${{ matrix.rid }}
      IMAGE: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Collect the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: executables-${{ matrix.rid }}
          path: dist

      - name: Collect the checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist

      - name: Collect the expected names
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: post-images-${{ matrix.arch }}
          path: expected

      - name: Check the archive against SHA256SUMS
        if: runner.os != 'Windows'
        working-directory: dist
        run: |
          grep " devbuddy-$RID.tar.gz\$" SHA256SUMS > mine
          if command -v sha256sum > /dev/null; then sha256sum -c mine; else shasum -a 256 -c mine; fi

      - name: Check the archive against SHA256SUMS
        if: runner.os == 'Windows'
        working-directory: dist
        shell: pwsh
        run: |
          $line = Get-Content SHA256SUMS | Where-Object { $_ -match " devbuddy-$env:RID\.tar\.gz$" }
          $wanted = $line.Split(' ')[0]
          $actual = (Get-FileHash "devbuddy-$env:RID.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $wanted) { throw "devbuddy-$env:RID.tar.gz is $actual, SHA256SUMS says $wanted" }
          "devbuddy-$env:RID.tar.gz: OK"

      - name: smoke.sh
        if: runner.os != 'Windows'
        run: |
          mkdir -p results
          sh tools/release/smoke.sh "dist/devbuddy-$RID.tar.gz" expected/ai-operations.txt ${IMAGE:+"$IMAGE"} \
            2>&1 | tee "results/smoke-$RID.txt"
          exit "${PIPESTATUS[0]}"

      # A relative archive path, on purpose: a GNU tar earlier in PATH reads "C:" as a host name.
      - name: client-smoke.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/client-smoke.ps1 `
            -Archive "dist/devbuddy-$env:RID.tar.gz" -Expected expected/ai-operations.txt `
            -Work (Join-Path $env:RUNNER_TEMP smoke) 2>&1 | Tee-Object "results/smoke-$env:RID.txt"
          exit $LASTEXITCODE

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.rid }}
          path: results/
          if-no-files-found: ignore

  # What the runners found, in the draft's notes, whether they passed or not. Run again, it replaces
  # its own section rather than adding a second one.
  smoke-report:
    name: Add the smoke results to the draft
    needs: [publish, post-images, smoke]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Collect the image results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: post-images-*
          path: results

      - name: Collect the smoke results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          path: results

      - name: Write them into the draft
        run: |
          marker='<!-- runner smoke results -->'
          {
            echo "$marker"
            echo "## Runner smoke results"
            echo
            echo "From [run $GITHUB_RUN_ID]($RUN_URL), by \`tools/release/\` at \`$TAG\`."
            echo
            if [ -f results/post-images-amd64/ai-operations.txt ] && [ -f results/post-images-arm64/ai-operations.txt ]; then
              if cmp -s results/post-images-amd64/ai-operations.txt results/post-images-arm64/ai-operations.txt; then
                echo "- The console image lists the same AI operations on amd64 and arm64."
              else
                echo "- **FAIL:** the console image lists different AI operations on amd64 and arm64."
              fi
            fi
            for row in post-images-amd64 post-images-arm64 smoke-linux-x64 smoke-linux-musl-x64 \
                smoke-linux-arm64 smoke-linux-musl-arm64 smoke-osx-arm64 smoke-win-arm64 smoke-win-x64; do
              file=$(find "results/$row" -name '*.txt' ! -name ai-operations.txt 2> /dev/null | head -1)
              if [ -z "$file" ]; then
                echo "- **$row: no result.** The job did not get as far as writing one."
                continue
              fi
              verdict=$(grep -E '^===' "$file" | tail -1)
              echo "- **$row:** ${verdict:-no final line}"
              failures=$(grep -E '^FAIL' "$file" || true)
              if [ -n "$failures" ]; then printf '%s\n' "$failures" | while IFS= read -r line; do echo "  - $line"; done; fi
            done
          } > section.md
          cat section.md >> "$GITHUB_STEP_SUMMARY"

          gh release view "$TAG" --json body -q .body > body.md
          awk -v m="$marker" '$0 == m { exit } { print }' body.md > notes.md
          cat section.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md
