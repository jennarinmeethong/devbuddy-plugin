name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevBuddy.slnx

      - name: Build
        run: dotnet build DevBuddy.slnx -c Release --no-restore

      # Ubuntu runners have a Docker engine, so the Testcontainers integration tests run there.
      - name: Test
        if: runner.os == 'Linux'
        run: dotnet test DevBuddy.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Windows runners cannot start Linux containers, so PostgreSQL and MinIO are unavailable.
      # The integration tests are excluded rather than skipped, and this comment is the record of
      # what Windows does not cover: DevBuddy.Api.Tests, DevBuddy.Infrastructure.Tests, and
      # DevBuddy.Security.Tests, which is every project holding a Testcontainers fixture.
      #
      # That list is checked by DockerDependentTestsTests rather than maintained by hand. It used
      # to name Infrastructure.Tests alone, true when written and false from Phase 4 onwards, and
      # the Windows job failed on every push until the first one anybody looked at.
      #
      # What still runs here is the point of having a Windows job at all: the domain, the
      # application pipeline, and the MCP host, on the platform whose path and culture handling
      # differs. Linux runs everything.
      - name: Test (excluding container integration tests)
        if: runner.os == 'Windows'
        run: dotnet test DevBuddy.slnx -c Release --no-build --filter "FullyQualifiedName!~DevBuddy.Api.Tests & FullyQualifiedName!~DevBuddy.Infrastructure.Tests & FullyQualifiedName!~DevBuddy.Security.Tests" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The whole system, as a deployment runs it: the three images built from this commit, PostgreSQL
  # and the object store, driven through the browser, the HTTP API and the MCP server by Playwright.
  # tests/e2e/run.sh builds and throws away a stack of its own; see tests/e2e/README.md.
  #
  # Twice: on x64, and on GitHub's arm64 runner (Phase 13, C9). The arm64 run builds the images
  # natively for linux/arm64 and runs the whole stack on server-class Arm hardware, which no release
  # checklist had done: every arm64 run before this was on an Apple M4.
  e2e:
    name: End-to-end (Playwright, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the suite against a fresh stack
        run: bash tests/e2e/run.sh
        env:
          CI: "true"
          DEVBUDDY_E2E_OUT: ${{ github.workspace }}/e2e-results

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.runner }}
          path: e2e-results
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format DevBuddy.slnx --verify-no-changes --severity warn

# Added in later phases, not claimed now:
#   Phase 10  dependency vulnerability gate (SB-28), SBOM (SB-29),
#             container build and inspection (SB-31), secret scan (SB-32)
#   Phase 11  security scenario suite gate
