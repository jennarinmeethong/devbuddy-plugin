name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevBuddy.slnx

      - name: Build
        run: dotnet build DevBuddy.slnx -c Release --no-restore

      # Ubuntu runners have a Docker engine, so the Testcontainers integration tests run there.
      - name: Test
        if: runner.os == 'Linux'
        run: dotnet test DevBuddy.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Windows runners cannot start Linux containers, so PostgreSQL and MinIO are unavailable.
      # The integration tests are excluded rather than skipped, and this comment is the record of
      # what Windows does not cover: DevBuddy.Api.Tests, DevBuddy.Infrastructure.Tests, and
      # DevBuddy.Security.Tests, which is every project holding a Testcontainers fixture.
      #
      # That list is checked by DockerDependentTestsTests rather than maintained by hand. It used
      # to name Infrastructure.Tests alone, true when written and false from Phase 4 onwards, and
      # the Windows job failed on every push until the first one anybody looked at.
      #
      # What still runs here is the point of having a Windows job at all: the domain, the
      # application pipeline, and the MCP host, on the platform whose path and culture handling
      # differs. Linux runs everything.
      - name: Test (excluding container integration tests)
        if: runner.os == 'Windows'
        run: dotnet test DevBuddy.slnx -c Release --no-build --filter "FullyQualifiedName!~DevBuddy.Api.Tests & FullyQualifiedName!~DevBuddy.Infrastructure.Tests & FullyQualifiedName!~DevBuddy.Security.Tests" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The whole system, as a deployment runs it: the three images built from this commit, PostgreSQL
  # and the object store, driven through the browser, the HTTP API and the MCP server by Playwright.
  # tests/e2e/run.sh builds and throws away a stack of its own; see tests/e2e/README.md.
  #
  # Twice: on x64, and on GitHub's arm64 runner (Phase 13, C9). The arm64 run builds the images
  # natively for linux/arm64 and runs the whole stack on server-class Arm hardware, which no release
  # checklist had done: every arm64 run before this was on an Apple M4.
  e2e:
    name: End-to-end (Playwright, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the suite against a fresh stack
        run: bash tests/e2e/run.sh
        env:
          CI: "true"
          DEVBUDDY_E2E_OUT: ${{ github.workspace }}/e2e-results
          # OWASP ZAP after the suite (Phase 14, C4), on one architecture: a second scan of the
          # same stack on arm64 would find the same things. Judged by tests/e2e/zap/rules.tsv.
          DEVBUDDY_E2E_ZAP: ${{ matrix.runner == 'ubuntu-latest' && '1' || '0' }}

      # The summary shows both reports and says which check failed. The run itself is failed by
      # run.sh, which judges the scans against tests/e2e/zap/rules.tsv (Phase 14, C4).
      - name: ZAP summary
        if: always() && matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          dir="$GITHUB_WORKSPACE/e2e-results/zap"
          if [ ! -s "$dir/status.txt" ]; then
            echo "::warning title=ZAP::ZAP did not run, so there is no report."
            echo "## OWASP ZAP: did not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## OWASP ZAP, judged by tests/e2e/zap/rules.tsv"
            echo
            sed 's/^/- /' "$dir/status.txt"
            for name in baseline api; do
              if [ -s "$dir/$name.md" ]; then echo; cat "$dir/$name.md"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Nothing found is a pass, and the step runs with pipefail, so grep's own "no match" must
          # not fail it.
          { grep -E "FAILED|DID NOT COMPLETE" "$dir/status.txt" || true; } | while IFS= read -r line; do
            echo "::error title=ZAP::$line"
          done

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.runner }}
          path: e2e-results
          if-no-files-found: ignore

  # The embeddings mode: pgvector, a stand-in model server and the real embedding sweep, asserting
  # on what reached the model (Phase 13, C1). A job of its own so the main run keeps testing the
  # shipped default stack.
  e2e-embeddings:
    name: End-to-end (embeddings)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the embeddings specs against a fresh stack
        run: bash tests/e2e/run.sh specs/embeddings.spec.ts --project chromium
        env:
          CI: "true"
          DEVBUDDY_E2E_EMBEDDINGS: "1"
          DEVBUDDY_E2E_RESTORE: "0"
          DEVBUDDY_E2E_OUT: ${{ github.workspace }}/e2e-results

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-embeddings-results
          path: e2e-results
          if-no-files-found: ignore

  # The GitHub source mode against a stand-in GitHub (Phase 13, C3).
  e2e-github:
    name: End-to-end (GitHub source mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the GitHub specs against a fresh stack
        run: bash tests/e2e/run.sh specs/github.spec.ts --project chromium
        env:
          CI: "true"
          DEVBUDDY_E2E_GITHUB: "1"
          DEVBUDDY_E2E_RESTORE: "0"
          DEVBUDDY_E2E_OUT: ${{ github.workspace }}/e2e-results

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-github-results
          path: e2e-results
          if-no-files-found: ignore

  # The shipped observability overlay, queried (Phase 13, C5).
  e2e-observability:
    name: End-to-end (observability)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the observability specs against a fresh stack
        run: bash tests/e2e/run.sh specs/observability.spec.ts --project chromium
        env:
          CI: "true"
          DEVBUDDY_E2E_OBSERVABILITY: "1"
          DEVBUDDY_E2E_RESTORE: "0"
          DEVBUDDY_E2E_OUT: ${{ github.workspace }}/e2e-results

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-observability-results
          path: e2e-results
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format DevBuddy.slnx --verify-no-changes --severity warn

  # The web client's own tests. Until 2026-09-26 nothing in CI ran them: the API image runs
  # `bun run build`, which type-checks, and they passed only when somebody ran them by hand. In the
  # image docker/Dockerfile.api builds the client with, so the Bun here is the Bun that ships and no
  # third-party setup action is needed.
  web:
    name: Web client tests
    runs-on: ubuntu-latest
    container: oven/bun:1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        working-directory: web/admin
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: web/admin
        run: bun test

# Added in later phases, not claimed now:
#   Phase 10  dependency vulnerability gate (SB-28), SBOM (SB-29),
#             container build and inspection (SB-31), secret scan (SB-32)
#   Phase 11  security scenario suite gate
