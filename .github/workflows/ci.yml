name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevBuddy.slnx

      - name: Build
        run: dotnet build DevBuddy.slnx -c Release --no-restore

      # Ubuntu runners have a Docker engine, so the Testcontainers integration tests run there.
      - name: Test
        if: runner.os == 'Linux'
        run: dotnet test DevBuddy.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Windows runners cannot start Linux containers, so PostgreSQL and MinIO are unavailable.
      # The integration tests are excluded rather than skipped, and this comment is the record of
      # what Windows does not cover: everything in DevBuddy.Infrastructure.Tests.
      - name: Test (excluding container integration tests)
        if: runner.os == 'Windows'
        run: dotnet test DevBuddy.slnx -c Release --no-build --filter "FullyQualifiedName!~DevBuddy.Infrastructure.Tests" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format DevBuddy.slnx --verify-no-changes --severity warn

