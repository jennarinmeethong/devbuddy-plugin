name: Node client contracts and packaging

on:
  pull_request:
    paths:
      - 'src/clients/devbuddy-npx/**'
      - 'src/clients/DevBuddy.Client/**'
      - 'tools/internal-npm-pilot/**'
      - 'plugins/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/npx-feasibility.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/clients/devbuddy-npx/**'
      - 'src/clients/DevBuddy.Client/**'
      - 'tools/internal-npm-pilot/**'
      - 'plugins/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/npx-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    name: Client contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15]
    env:
      DEVBUDDY_TEST_DOTNET_DLL: ${{ github.workspace }}/src/clients/DevBuddy.Client/bin/Release/net10.0/devbuddy.dll
    defaults:
      run:
        working-directory: src/clients/devbuddy-npx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - run: dotnet build ../DevBuddy.Client -c Release
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build
      - run: bun test tests
      - name: Actual Unix PTY hidden input and terminal restoration
        if: runner.os != 'Windows'
        run: python3 tools/tty-smoke.py
      # No store access: CI is not an interactive Keychain/Credential Manager session,
      # and these runners do not prove SAC enforcement. Native probes are explicit drills.
      - run: node dist/probe-main.js --help
      - name: Packed prototype through npx (cold and warm cache, no native-store access)
        run: node tools/npx-smoke.mjs
      - name: Production client HTTP and stdio integration (synthetic file store)
        run: node tools/client-smoke.mjs
      - name: Real-process HTTP errors, cancellation and deadlines (synthetic only)
        env:
          DEVBUDDY_TEST_LONG_TIMEOUT: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: node tools/runtime-errors-smoke.mjs
      - name: Production package inventory, script-disabled install and integration
        run: node tools/package-smoke.mjs
      # This pilot is tied to its reviewed artifact hash; changes need a new acceptance decision.
      - name: Scoped internal npm-default profiles (synthetic, no host activation)
        run: |
          npm pack --ignore-scripts --pack-destination out
          node ../../tools/internal-npm-pilot/test.mjs out/devbuddy-plugin-client-1.14.0-next.0.tgz
      - name: Synthetic TLS trust, redirects and connection interruption
        if: runner.os != 'Windows'
        run: node tools/tls-smoke.mjs

  musl:
    name: Musl package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: src/clients/devbuddy-npx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      # Container follows the runner's native architecture. No QEMU acceptance.
      - run: sh tools/musl-smoke.sh
