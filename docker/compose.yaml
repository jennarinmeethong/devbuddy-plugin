# The self-hosted stack: PostgreSQL, MinIO, the API, and the MCP server.
#
# What is deliberately absent is as much of the design as what is here.
#
#   - PostgreSQL and MinIO publish no host ports. They are reachable on the internal network and
#     from nowhere else. An operator who needs a psql session runs it in the network, not through
#     a port mapped to every interface on the host.
#   - Nothing mounts the Docker socket. A container that can talk to the daemon is root on the
#     host, and no part of this system has any reason to.
#   - No service runs as root. The application images ship with a non-root account and use it; the
#     database is told which one; the object store already uses its own and is left alone, because
#     overriding it leaves the image unable to write to a fresh volume.
#   - There is no TLS here. This stack is meant to sit behind a reverse proxy that terminates it,
#     and pretending otherwise with a self-signed certificate would teach the wrong shape. See
#     docs/operations/deployment.md.
#
# Secrets come from the environment. `docker/.env.example` lists them; copy it to `docker/.env`,
# fill it in, and keep that file out of the repository — .gitignore already refuses it.
#
#   docker compose -f docker/compose.yaml up -d

name: devbuddy

x-logging: &app-logging
  # A size-bounded floor for the application logs the retention schedule names (SB-27). Not the
  # schedule's 90-day window — a log driver rotates on size, not on a calendar — but it is what
  # keeps a chatty container from filling the host disk while a proper log pipeline is not yet
  # part of this deployment. An operator forwarding to an aggregator applies that aggregator's own
  # retention instead.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

# What the console needs, wherever it is run from: `migrate` once at deployment, and `retention`
# for as long as the stack is up. One definition rather than two, because two would eventually
# differ — most likely in which volume one of them forgot, and a retention sweep that cannot see
# the backup volume reports zero deletions and looks like it worked.
x-console-environment: &console-environment
  DEVBUDDY_ConnectionStrings__DevBuddy: >-
    Host=database;Port=5432;Database=devbuddy;Username=devbuddy;Password=${DEVBUDDY_DB_PASSWORD}
  DEVBUDDY_Evidence__Provider: ObjectStorage
  DEVBUDDY_Evidence__ServiceUrl: http://evidence:9000
  DEVBUDDY_Evidence__AccessKey: ${DEVBUDDY_EVIDENCE_ACCESS_KEY}
  DEVBUDDY_Evidence__SecretKey: ${DEVBUDDY_EVIDENCE_SECRET_KEY}
  DEVBUDDY_Backup__RootPath: /srv/backups
  DEVBUDDY_Export__RootPath: /srv/exports
  # The application writes and sweeps its own log files, which is what turns the ninety-day row of
  # the retention schedule into a tested behaviour rather than a log-driver size to pick by hand.
  # Clear the path and this reverts to standard output only; docs/operations/logging.md sets out
  # that trade. The `retention` service below does the deleting, on the interval it is given.
  DEVBUDDY_Logging__File__Path: ${DEVBUDDY_LOG_PATH:-/srv/logs/devbuddy.log}
  DEVBUDDY_Logging__File__RetentionDays: ${DEVBUDDY_LOG_RETENTION_DAYS:-90}

x-console-volumes: &console-volumes
  # The console is how a restore is performed — it runs outside the pipeline, because a restore
  # from total loss has no accounts to authorise against — so it needs the backups and the object
  # store the artefacts go back into. Exports and backups share this image so the retention sweep
  # can purge both.
  - backups:/srv/backups
  - exports:/srv/exports

  # And the logs, because this is the image the sweep runs in and log files are one of the ten
  # rows it enforces.
  - logs:/srv/logs

services:
  database:
    # postgres:17-alpine by default, which is what every deployment has run so far and what the
    # suite tests against. It does NOT carry pgvector, so the vector index migration skips itself
    # there and IEmbeddingIndex reports the index as absent — full-text search is unaffected and
    # nothing else notices (ADR-0012).
    #
    # An installation that turns embeddings on needs a pgvector-capable image instead:
    #   DEVBUDDY_DB_IMAGE=pgvector/pgvector:pg17
    # Changing this is a migration of the data directory, not a restart: take a backup first, and
    # note pgvector/pgvector is Debian-based rather than Alpine, so the image is larger.
    image: ${DEVBUDDY_DB_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: devbuddy
      POSTGRES_USER: devbuddy
      POSTGRES_PASSWORD: ${DEVBUDDY_DB_PASSWORD:?set DEVBUDDY_DB_PASSWORD in docker/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbuddy -d devbuddy"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  evidence:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped

    # No user override. The image already runs as a non-root account and its entrypoint takes
    # ownership of the data directory; pinning a uid here left it unable to write to a fresh
    # volume, which fails as "drive may be faulty" and is not that.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${DEVBUDDY_EVIDENCE_ACCESS_KEY:?set DEVBUDDY_EVIDENCE_ACCESS_KEY in docker/.env}
      MINIO_ROOT_PASSWORD: ${DEVBUDDY_EVIDENCE_SECRET_KEY:?set DEVBUDDY_EVIDENCE_SECRET_KEY in docker/.env}

      # The application asks for server-side encryption on every object it stores
      # (Evidence:UseServerSideEncryption, on by default), and MinIO refuses that outright unless
      # it has a key to encrypt with: "Server side encryption specified but KMS is not configured".
      # Without this line every evidence upload fails with a 500, which is what happened the first
      # time anyone attached a file — the capability to do so is newer than this stack.
      #
      # MinIO's built-in KMS, which is what it offers for a single node. A larger installation runs
      # KES and points MINIO_KMS_KES_* at it instead; that is a change to this file, not to the
      # application, because the application only ever asks for AES256 and lets the store arrange it.
      MINIO_KMS_SECRET_KEY: ${DEVBUDDY_EVIDENCE_KMS_KEY:?set DEVBUDDY_EVIDENCE_KMS_KEY in docker/.env}
    volumes:
      - evidence:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Runs once, applies migrations, exits. The servers wait for it to complete, so a deployment
  # cannot race a schema change.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    restart: "no"
    command: ["migrate"]
    environment: *console-environment
    volumes: *console-volumes
    depends_on:
      database:
        condition: service_healthy
    networks: [internal]

  # The retention sweep, on a schedule, in the image that already carries the code.
  #
  # Through v1 this service did not exist: `dotnet run -- retention` was documented and tested, and
  # ran only if an operator built something to run it. A window nothing sweeps is a window in name
  # only, so the ten rows of the retention schedule were enforced in code and unscheduled in fact.
  #
  # Why a mode on the console rather than a `cron` sidecar: the three application images are
  # chiseled — no shell, no package manager, nothing in them to execute — and a sidecar running
  # cron would mean building a shell-bearing image for the purpose and putting it back into a stack
  # that was made this way deliberately. `retention --every` keeps the schedule inside the one
  # image that already has the sweep in it.
  #
  # It still runs OUTSIDE the use-case pipeline, which is the part that matters. A pass spans every
  # workspace and project and has no caller to authorise it against, exactly like `restore`; a
  # scheduler that acquired a caller would be the installation-wide superuser this system does not
  # have. There is no actor here and no token, and there is nothing for one to be.
  retention:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    logging: *app-logging

    # Daily by default. Every window in the schedule is measured in days or years, so a shorter
    # interval buys nothing and costs a full pass over the audit, backup, export and log stores.
    command: ["retention", "--every", "${DEVBUDDY_RETENTION_EVERY:-24h}"]
    environment: *console-environment
    volumes: *console-volumes
    depends_on:
      database:
        condition: service_healthy
      evidence:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      # The only thing reachable from the host. Bound to loopback: put a reverse proxy in front of
      # it and let that hold the certificate.
      - "127.0.0.1:8080:8080"
    logging: *app-logging
    environment:
      DEVBUDDY_ConnectionStrings__DevBuddy: >-
        Host=database;Port=5432;Database=devbuddy;Username=devbuddy;Password=${DEVBUDDY_DB_PASSWORD}
      DEVBUDDY_Identity__SigningKey: ${DEVBUDDY_SIGNING_KEY:?set DEVBUDDY_SIGNING_KEY in docker/.env}
      DEVBUDDY_Evidence__Provider: ObjectStorage
      DEVBUDDY_Evidence__ServiceUrl: http://evidence:9000
      DEVBUDDY_Evidence__AccessKey: ${DEVBUDDY_EVIDENCE_ACCESS_KEY}
      DEVBUDDY_Evidence__SecretKey: ${DEVBUDDY_EVIDENCE_SECRET_KEY}
      DEVBUDDY_Analysis__RootPath: /srv/projects
      # The application writes and sweeps its own log files, which is what turns the ninety-day row
      # of the retention schedule into a tested behaviour rather than a log-driver size to pick by
      # hand. Clear the path and this reverts to standard output only; docs/operations/logging.md
      # sets out that trade. `dotnet run -- retention` does the deleting, on the operator's own
      # schedule, exactly as it does for backups and exports.
      DEVBUDDY_Logging__File__Path: ${DEVBUDDY_LOG_PATH:-/srv/logs/devbuddy.log}
      DEVBUDDY_Logging__File__RetentionDays: ${DEVBUDDY_LOG_RETENTION_DAYS:-90}
      DEVBUDDY_Backup__RootPath: /srv/backups
      DEVBUDDY_Export__RootPath: /srv/exports

      # Delivery for setup and recovery tokens. Left alone the provider stays Log, and since Phase
      # 12B that no longer means the token is written to a log: AllowTokensInLog below is false, so
      # the fallback sender records that a message could not be delivered, to whom, and how to fix
      # that, and writes the token nowhere. A setup token is still returned in the
      # create_user_account response, so inviting somebody works with no mail server at all; a
      # self-service recovery token has no second route and is deliberately unreachable until one
      # of the two settings below is changed.
      #
      # Setting this to Smtp with a host below is the option that actually delivers.
      #
      # Spelled out rather than inferred from whether a host is set. Compose can substitute one
      # value when a variable is present, but the else branch is the empty string, and an empty
      # string is not a member of this enum — a deployment that left SMTP alone would fail to
      # start on a setting it never touched.
      DEVBUDDY_Email__Provider: ${DEVBUDDY_EMAIL_PROVIDER:-Log}
      DEVBUDDY_Email__Host: ${DEVBUDDY_SMTP_HOST:-}
      DEVBUDDY_Email__Port: ${DEVBUDDY_SMTP_PORT:-587}
      DEVBUDDY_Email__Username: ${DEVBUDDY_SMTP_USERNAME:-}
      DEVBUDDY_Email__Password: ${DEVBUDDY_SMTP_PASSWORD:-}
      DEVBUDDY_Email__UseStartTls: ${DEVBUDDY_SMTP_START_TLS:-true}
      DEVBUDDY_Email__FromAddress: ${DEVBUDDY_SMTP_FROM:-devbuddy@localhost}

      # The other option, and a deliberate one: true writes one-time setup and recovery tokens
      # into the application log for an operator to carry by hand — which is what v1 did
      # unconditionally, and what docs/security/release-readiness.md carried as an accepted risk.
      # A retention window is not a control over who can read the file while it exists, so
      # whoever sets this is accepting that anything able to read the log volume can use the
      # tokens in it.
      DEVBUDDY_Email__AllowTokensInLog: ${DEVBUDDY_EMAIL_ALLOW_TOKENS_IN_LOG:-false}

      # Embeddings. None by default, which registers no provider at all: full-text search is what
      # v1 shipped and is complete on its own. SelfHosted points at a model inside this deployment
      # and sends no project text out of it; HostedApi sends project text to a vendor and is a
      # third egress path, so it refuses to start unless its host is also named in
      # OutboundAccess:AllowedHosts. See ADR-0012 and info.md before setting that one.
      DEVBUDDY_Embedding__Provider: ${DEVBUDDY_EMBEDDING_PROVIDER:-None}
      DEVBUDDY_Embedding__Endpoint: ${DEVBUDDY_EMBEDDING_ENDPOINT:-}
      DEVBUDDY_Embedding__Model: ${DEVBUDDY_EMBEDDING_MODEL:-}
      DEVBUDDY_Embedding__ApiKey: ${DEVBUDDY_EMBEDDING_API_KEY:-}
      DEVBUDDY_Embedding__Dimensions: ${DEVBUDDY_EMBEDDING_DIMENSIONS:-0}
      DEVBUDDY_Embedding__BatchSize: ${DEVBUDDY_EMBEDDING_BATCH_SIZE:-32}
    volumes:
      # Read-only. Analysis reads a working copy and never writes to it, and the mount says so as
      # well as the code (SB-04).
      - ${DEVBUDDY_PROJECTS_PATH:-./projects}:/srv/projects:ro

      # The one writable path these read-only containers have besides /tmp.
      - logs:/srv/logs
      - backups:/srv/backups
      - exports:/srv/exports
    depends_on:
      database:
        condition: service_healthy
      evidence:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl in a chiseled image, which is the point of one. The runtime can reach itself.
      test: ["CMD", "dotnet", "DevBuddy.Api.dll", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [internal]

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8081:8080"
    logging: *app-logging
    environment:
      DEVBUDDY_ConnectionStrings__DevBuddy: >-
        Host=database;Port=5432;Database=devbuddy;Username=devbuddy;Password=${DEVBUDDY_DB_PASSWORD}
      DEVBUDDY_Identity__SigningKey: ${DEVBUDDY_SIGNING_KEY}
      DEVBUDDY_Evidence__Provider: ObjectStorage
      DEVBUDDY_Evidence__ServiceUrl: http://evidence:9000
      DEVBUDDY_Evidence__AccessKey: ${DEVBUDDY_EVIDENCE_ACCESS_KEY}
      DEVBUDDY_Evidence__SecretKey: ${DEVBUDDY_EVIDENCE_SECRET_KEY}
      DEVBUDDY_Analysis__RootPath: /srv/projects
      # The application writes and sweeps its own log files, which is what turns the ninety-day row
      # of the retention schedule into a tested behaviour rather than a log-driver size to pick by
      # hand. Clear the path and this reverts to standard output only; docs/operations/logging.md
      # sets out that trade. `dotnet run -- retention` does the deleting, on the operator's own
      # schedule, exactly as it does for backups and exports.
      DEVBUDDY_Logging__File__Path: ${DEVBUDDY_LOG_PATH:-/srv/logs/devbuddy.log}
      DEVBUDDY_Logging__File__RetentionDays: ${DEVBUDDY_LOG_RETENTION_DAYS:-90}
    volumes:
      - ${DEVBUDDY_PROJECTS_PATH:-./projects}:/srv/projects:ro

      # The one writable path these read-only containers have besides /tmp.
      - logs:/srv/logs
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

volumes:
  # Named, so `docker compose down` without -v keeps them and a container replacement is not a
  # data loss event. The restore drill proves that.
  database:
  evidence:
  backups:
  exports:

  # The application's own log files, when Logging:File:Path is set below. A separate volume rather
  # than a directory in an existing one: it is the only writable path these read-only containers
  # have besides /tmp, and the retention sweep deletes from it.
  logs:

networks:
  internal:
    driver: bridge
