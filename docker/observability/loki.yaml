# Single-binary Loki with filesystem storage. Enough for one self-hosted installation; a larger
# deployment replaces this file rather than the application's configuration.
#
# retention_period is the whole reason this exists: it is the 90 days docs/plan.md's retention
# schedule names for application logs, enforced by time rather than approximated by file size the
# way the json-file log driver does it.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 2160h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
