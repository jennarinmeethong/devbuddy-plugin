# Traces, kept for a fortnight rather than the ninety days logs get. A trace answers "why was this
# request slow last Tuesday"; nobody asks that about last quarter, and traces are the largest and
# least re-readable of the three signals.

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 336h
