# Trivy findings accepted on purpose, approved 2026-09-26 (`info.md`).
#
# The rule, from the project's exception governance: every entry names one finding by ID, narrows
# it to the paths it applies to where Trivy allows that, says why in `statement`, and expires.
# Trivy stops honouring an entry after `expired_at`, so an expired acceptance fails the scan again
# rather than lasting forever. `SupplyChainPolicyTests` fails the build if an entry lacks either.
# Renewing one is a decision, recorded in `info.md`, not an edit to make the build pass.

misconfigurations:
  - id: DS-0026
    paths:
      - docker/Dockerfile.api
      - docker/Dockerfile.cli
      - docker/Dockerfile.mcp
      - docker/evidence/Dockerfile
      - tests/e2e/Dockerfile
    statement: >-
      No HEALTHCHECK in the Dockerfile. The images are chiseled or scratch, with no shell or curl
      for one to run, so docker/compose.yaml declares each health check where it can name the
      binary: the API runs `DevBuddy.Api.dll --health-check`, the evidence store `mc ready local`.
      The console runs one command and exits; the e2e image is a test runner.
    expired_at: 2027-03-26

# The evidence store's Go modules (2026-09-26, info.md). MinIO RELEASE.2025-10-15T17-29-55Z and mc
# RELEASE.2025-08-13T08-35-41Z are the last releases either project published, and both repositories
# are archived, so the versions below are fixed in their go.mod and no upstream release will move
# them. Built with Go 1.26.8, which cleared every standard-library finding, and at the release that
# fixes MinIO's own CVE-2025-62506. What is left is accepted for three months, while Phase 14 C6
# replaces MinIO. The store is reachable only on the stack's internal network, by the API and the
# console, with credentials; no notification target (AMQP, Kafka and the like) is configured, and
# the image holds nothing else to execute. Renewing any of these is a decision in info.md.
vulnerabilities:
  - id: CVE-2026-41602
    paths: [usr/bin/minio]
    statement: HIGH github.com/apache/thrift in a module MinIO pins; see the note above.
