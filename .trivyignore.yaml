# Trivy findings accepted on purpose, approved 2026-09-26 (`info.md`).
#
# The rule, from the project's exception governance: every entry names one finding by ID, narrows
# it to the paths it applies to where Trivy allows that, says why in `statement`, and expires.
# Trivy stops honouring an entry after `expired_at`, so an expired acceptance fails the scan again
# rather than lasting forever. `SupplyChainPolicyTests` fails the build if an entry lacks either.
# Renewing one is a decision, recorded in `info.md`, not an edit to make the build pass.

misconfigurations:
  - id: DS-0026
    paths:
      - docker/Dockerfile.api
      - docker/Dockerfile.cli
      - docker/Dockerfile.mcp
      - docker/evidence/Dockerfile
      - tests/e2e/Dockerfile
    statement: >-
      No HEALTHCHECK in the Dockerfile. The images are chiseled or scratch, with no shell or curl
      for one to run, so docker/compose.yaml declares each health check where it can name the
      binary: the API runs `DevBuddy.Api.dll --health-check`, the evidence store `healthprobe`.
      The console runs one command and exits; the e2e image is a test runner.
    expired_at: 2027-03-26

# The evidence store (ADR-0014, info.md 2026-09-27). SeaweedFS 4.47 pins google.golang.org/grpc as
# the untagged `v1.85.0-dev`, with no date or commit, so Trivy cannot place it before or after the
# fix and reports it. No SeaweedFS release pins anything else yet. The store is reachable only on
# the stack's internal network, and its gRPC ports only inside its own container. Accepted until the
# date below; a newer SeaweedFS that clears it removes the entry. Until 2026-09-27 thirty-nine
# entries here accepted MinIO's pinned modules; they went with MinIO and are not renewed.
vulnerabilities:
  - id: CVE-2026-84445
    paths: [usr/bin/weed]
    statement: >-
      HIGH google.golang.org/grpc, pinned by SeaweedFS as the untagged v1.85.0-dev, which Trivy
      cannot order against the fixed versions. Internal network only; see the note above.
    expired_at: 2026-12-26
